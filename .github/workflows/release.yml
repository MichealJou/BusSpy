name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            args: ""
            rust-targets: ""
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            rust-targets: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev pkg-config

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 从 tag 提取版本号,强制写回 Cargo.toml 并同步到 package.json,
      # 保证构建产物的版本号一定和 tag 一致,杜绝"tag 是 0.1.8 文件是 0.1.7"的问题。
      - name: Sync version from tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.version || github.ref_name }}
        run: |
          # tag 形如 v0.1.8,去掉前导 v 得到 0.1.8
          VERSION="${TAG#v}"
          echo "tag=$TAG → version=$VERSION"
          # 写回 Cargo.toml(版本号单一来源)
          sed -i.bak -E "s/^version = \".*\"/version = \"$VERSION\"/" apps/desktop/src-tauri/Cargo.toml
          rm -f apps/desktop/src-tauri/Cargo.toml.bak
          # 同步到 package.json
          node scripts/sync-version.mjs
          echo "--- 确认版本号 ---"
          grep '^version' apps/desktop/src-tauri/Cargo.toml
          grep '"version"' apps/desktop/package.json

      # === macOS 路径:只构建不上传 → 重制 dmg 塞入信任脚本 → 手动上传 ===
      - name: Build (macOS, no upload)
        if: startsWith(matrix.platform, 'macos')
        id: tauri-build-macos
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

      - name: Rebuild macOS dmg with trust script
        if: startsWith(matrix.platform, 'macos')
        env:
          ARTIFACT_PATHS: ${{ steps.tauri-build-macos.outputs.artifactPaths }}
        run: |
          # artifactPaths 是 JSON 数组字符串,如 ["/path/a.dmg","/path/b.app"]
          # 用 jq 解析出每个路径,找到 .dmg 重制
          DMG_PATH="$(echo "$ARTIFACT_PATHS" | jq -r '.[]' | grep '\.dmg$' | head -n1)"
          if [ -z "$DMG_PATH" ]; then
            echo "未找到 dmg 产物,artifactPaths=$ARTIFACT_PATHS" >&2
            exit 1
          fi
          echo "原 dmg:$DMG_PATH"
          bash .github/scripts/rebuild-dmg.sh "$DMG_PATH" scripts/dmg-trust.command

      - name: Upload macOS assets to release
        if: startsWith(matrix.platform, 'macos')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATHS: ${{ steps.tauri-build-macos.outputs.artifactPaths }}
          TAG: ${{ github.event.release.tag_name || inputs.version || github.ref_name }}
        run: |
          # macOS job 与 Windows/Linux job 并行,release 可能还没被创建。
          # 先确保 release 存在(不存在则创建),再上传产物。
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "release 不存在,创建 $TAG"
            gh release create "$TAG" \
              --title "BusSpy $TAG" \
              --notes "BusSpy $TAG" \
              --target "$GITHUB_SHA"
          fi
          # artifactPaths 是 JSON 数组字符串,用 jq 解析后逐个上传
          echo "$ARTIFACT_PATHS" | jq -r '.[]' | while IFS= read -r ARTIFACT; do
            echo "上传:$ARTIFACT"
            gh release upload "$TAG" "$ARTIFACT" --clobber
          done

      # === Windows / Linux 路径:一步构建 + 上传(原样) ===
      - name: Build and upload release assets (Windows/Linux)
        if: ${{ !startsWith(matrix.platform, 'macos') }}
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.event.release.tag_name || inputs.version || github.ref_name }}
          releaseName: BusSpy ${{ github.event.release.tag_name || inputs.version || github.ref_name }}
          releaseBody: |
            BusSpy ${{ github.event.release.tag_name || inputs.version || github.ref_name }}

            下载对应系统的安装包：

            - Windows：`.exe` / `.msi`
            - macOS：`.dmg`(已内置"首次运行请双击.command",双击即可去掉未签名提示)
            - Linux：`.AppImage` / `.deb` / `.rpm`

            未签名版本首次运行可能需要手动允许，Linux 串口访问可能需要加入 `dialout` 用户组。

            更新说明见：
            https://github.com/MichealJou/BusSpy/blob/${{ github.ref_name }}/CHANGELOG.md
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: BusSpy-[version]-[platform]-[arch]-[bundle][setup][ext]
